name: Run XAUUSD Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # setiap 15 menit, sesuaikan
  workflow_dispatch:          # trigger manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          # Set false untuk nonaktifkan filter sesi (bot aktif 24 jam hari kerja)
          ENABLE_SESSION_FILTER: "false"
          # Token Telegram (kosongkan jika belum siap, tapi bot akan error di validasi)
          # Untuk testing tanpa token, set REQUIRE_TELEGRAM=false di settings.py dan tambahkan env di bawah
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Jika ingin mengubah parameter lain, tambahkan di sini
        run: python main.py
