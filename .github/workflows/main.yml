name: Run XAUUSD Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # setiap 15 menit, sesuaikan
  workflow_dispatch:          # trigger manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          # Hanya set variabel yang memang ingin di-override.
          # Untuk yang tidak diset, bot akan memakai default dari settings.py
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Jika ingin mengubah parameter lain, tambahkan di sini,
          # misalnya:
          # MIN_SCORE: ${{ secrets.MIN_SCORE }}
        run: python main.py
